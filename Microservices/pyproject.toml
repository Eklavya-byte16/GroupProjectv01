readme = "README.md"
authors = [
    { name = "Eklavya", email = "atharvawaste16@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=1.28.0",
    "langchain>=1.3.16",
